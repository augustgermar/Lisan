[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lisan"
version = "26.10.29"
description = "Lisan local-first memory vault CLI"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Lisan Contributors"}]
dependencies = [
    "fastembed>=0.3.0",
]

[project.optional-dependencies]
# In-process semantic embeddings (Qdrant FastEmbed, ONNX, CPU-only, no torch).
# Kept as a compatibility alias; the core install now includes fastembed by default.
embeddings = ["fastembed>=0.3.0"]
pdf = ["pymupdf>=1.24.0"]
# Claude provider: drives the local `claude` CLI via the Claude Agent SDK (no API key).
claude = ["claude-agent-sdk>=0.2"]
docs = ["mkdocs-material>=9.5"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
lint = ["ruff>=0.8"]
# LangGraph is experimental (spike/langgraph-writer-skeptic): it orchestrates
# the bounded Writer-Skeptic loop only. The deterministic fallback in
# lisan/tools/writer_skeptic_graph.py runs the identical loop when LangGraph
# is not installed, so the core install stays dependency-lean by design.
langgraph = ["langgraph>=1.2,<2"]

[project.scripts]
lisan = "lisan.cli:main"

[tool.setuptools]
packages = ["lisan", "lisan.providers", "lisan.tools", "lisan.agents", "lisan.schemas"]

[tool.setuptools.package-data]
"lisan.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lisan"]
# Relative paths are required by the coverage badge action in CI.
relative_files = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["evals/wipe-runs"]

[tool.ruff.lint]
# Ruff's defaults (pyflakes plus core pycodestyle errors), plus import
# sorting (I) and modern-syntax upgrades for the supported Pythons (UP).
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lisan"]
